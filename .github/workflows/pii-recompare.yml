# Re-run the head-to-head with an already trained v3 (no retraining), e.g.
# after a change to piiguard's rules. Commits the new benchmarks.
name: piiguard recompare
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run of the 'piiguard v3' workflow whose v3-model to use"
        default: "45961921851"
  push:
    branches: ["claude/pii-v3"]
    paths: [".github/workflows/pii-recompare.yml"]
permissions:
  contents: write
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==2.4.1" "transformers==4.46.3" \
            "datasets==3.1.0" "huggingface_hub<1" "presidio-analyzer==2.2.355"
          python -m spacy download en_core_web_lg -q
          pip install --no-deps ./piiguard
      - uses: actions/download-artifact@v4
        with: { name: v3-model, path: build/v3, run-id: "${{ inputs.run_id || '45961921851' }}", github-token: "${{ github.token }}" }
      - name: v3 vs current vs Presidio vs spaCy
        run: |
          cd training
          python compare.py --rows 1000 --system piiguard:../build/v3 --system piiguard:ChadTollison/pii-distilbert-v2 \
            --system presidio --system spacy
          cat ../benchmarks/compare.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add benchmarks
          git commit -m "piiguard v3: benchmark vs Presidio and spaCy (rules + short windows)" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
