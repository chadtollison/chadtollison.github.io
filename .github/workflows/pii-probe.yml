# Shows what scrubpii misses and peeks at candidate harder test sets.
name: scrubpii probe
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["training/probe.py", ".github/workflows/pii-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install "datasets==3.1.0" "huggingface_hub<1" ./scrubpii
      - run: cd training && python probe.py 2>&1 | tee ../probe.txt
      - uses: actions/upload-artifact@v4
        with: { name: probe, path: probe.txt }
