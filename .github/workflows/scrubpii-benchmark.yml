# The head-to-head benchmark: scrubpii (this branch, ONNX) vs Microsoft
# Presidio vs spaCy on seven test sets, three of them hard kinds of text the
# model never trained on. Commits benchmarks/compare.md and compare.json.
name: scrubpii benchmark
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["training/compare.py", "training/pii_data.py", ".github/workflows/scrubpii-benchmark.yml"]
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: |
          pip install "datasets==3.1.0" "huggingface_hub<1" "presidio-analyzer==2.2.355" ./scrubpii
          python -m spacy download en_core_web_lg -q
      - name: scrubpii vs Presidio vs spaCy
        run: |
          cd training
          python compare.py --rows 1000 --out compare \
            --system "scrubpii@onnx:ChadTollison/pii-distilbert-v3=scrubpii" --system presidio --system presidio+scrubpii --system spacy
          cat ../benchmarks/compare.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          cp benchmarks/compare.* /tmp/
          git fetch origin "${GITHUB_REF_NAME}" && git reset -q --hard FETCH_HEAD
          cp /tmp/compare.* benchmarks/
          git add benchmarks/compare.*
          git commit -m "scrubpii: benchmark vs Presidio and spaCy" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
