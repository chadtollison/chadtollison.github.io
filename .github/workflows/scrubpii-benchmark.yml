# The head-to-head benchmark: scrubpii (this branch, ONNX) vs Microsoft
# Presidio (English default and a per-language setup) vs spaCy on ten test
# sets. Headline score is strict (items fully hidden, redacted characters that
# were personal). Commits benchmarks/compare.md and compare.json.
name: scrubpii benchmark
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["training/compare.py", "training/test_compare.py", "training/pii_data.py", ".github/workflows/scrubpii-benchmark.yml"]
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: |
          pip install "datasets==3.1.0" "huggingface_hub<1" "presidio-analyzer==2.2.355" pytest ./scrubpii
          for m in en_core_web_lg es_core_news_lg fr_core_news_lg de_core_news_lg it_core_news_lg; do python -m spacy download $m -q; done
      - name: Scorer self-test (a one-character detector must not score well)
        run: cd training && python -m pytest -q test_compare.py
      - name: scrubpii vs Presidio vs spaCy
        run: |
          cd training
          export SCRUBPII_MODEL=../models/pii-distilbert-v5
          python compare.py --rows 1000 --out compare \
            --system "scrubpii@onnx:../models/pii-distilbert-v5=scrubpii" --system presidio --system presidio-multi --system presidio+scrubpii --system spacy
          cat ../benchmarks/compare.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          cp benchmarks/compare.* /tmp/
          git fetch origin "${GITHUB_REF_NAME}" && git reset -q --hard FETCH_HEAD
          cp /tmp/compare.* benchmarks/
          git add benchmarks/compare.*
          git commit -m "scrubpii: benchmark vs Presidio and spaCy" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
