# Tests the scrubpii Python package (in scrubpii/) and, when you ask it to,
# publishes it to PyPI. Publishing uses PyPI "trusted publishing", so there is
# no token to store: PyPI trusts this workflow once you add it as a publisher.
# Publish: Actions tab -> "scrubpii package" -> Run workflow -> tick "publish".
# (The file keeps the name piiguard-package.yml because PyPI trusts this file name.)
name: scrubpii package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this version to PyPI"
        type: boolean
        default: false
  push:
    branches: [main, "claude/**"]
    paths: ["scrubpii/**", ".github/workflows/piiguard-package.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install build
          pip install "./scrubpii[test]"
          python -c "import importlib.util as u; assert u.find_spec('torch') is None, 'torch should not be a default dependency'"
      - name: Unit tests
        run: pytest -q scrubpii/tests
      - name: Try it with the real model
        run: |
          python - <<'PY'
          from scrubpii import redact, tokenize, restore, find
          text = "Hi, I'm Sarah Johnson. Email sarah.j@example.com or call 6626341142. IBAN GB82 WEST 1234 5698 7654 32."
          print(redact(text))
          from scrubpii import redact_many, redact_json, Guard
          print(redact_many([text, "Raj Patel, raj@example.com"]))
          print(redact_json({"a": {"b": text}}))
          for m in ("mask", "fake"):
              print(m, "->", redact(text, mode=m))
          safe, key = tokenize(text)
          print(safe, key)
          assert restore(safe, key) == text
          out = redact(text)
          for secret in ("Sarah Johnson", "sarah.j@example.com", "6626341142", "GB82 WEST"):
              assert secret not in out, secret
          PY
          scrubpii --find "My SSN is 123-45-6789"
      - name: Same answers with the PyTorch backend
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.6"
          pip install "./scrubpii[torch]"
          SCRUBPII_BACKEND=torch python -c "from scrubpii import redact; out = redact('Hi, I am Sarah Johnson, sarah.j@example.com'); print(out); assert 'Sarah Johnson' not in out"
      - name: Build
        run: python -m build scrubpii --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: scrubpii-dist
          path: dist

  publish:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scrubpii-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
