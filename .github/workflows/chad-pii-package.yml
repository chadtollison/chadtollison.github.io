# Builds the small "chad-pii" alias package (alias/chad-pii/), which installs
# scrubpii under the package's old name, and publishes it to PyPI when asked.
# PyPI trusts this workflow file for the chad-pii project (trusted publishing).
# Publish: Actions tab -> "chad-pii alias package" -> Run workflow -> tick "publish".
name: chad-pii alias package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this version to PyPI"
        type: boolean
        default: false
  push:
    branches: [main, "claude/**"]
    paths: ["alias/chad-pii/**", ".github/workflows/chad-pii-package.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          pip install build
          python -m build alias/chad-pii --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: chad-pii-dist
          path: dist

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chad-pii-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
