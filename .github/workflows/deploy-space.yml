# Pushes space/ to the Hugging Face Space ChadTollison/piiguard.
# Needs the HF_TOKEN repository secret (a Hugging Face token with write access).
# Start it from the Actions tab: "Deploy Hugging Face Space" -> "Run workflow".
name: Deploy Hugging Face Space
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install "huggingface_hub<1"
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "::error::Add an HF_TOKEN secret first (Settings > Secrets and variables > Actions)."; exit 1; fi
          python - <<'PY'
          from huggingface_hub import HfApi
          api = HfApi()
          api.create_repo("ChadTollison/piiguard", repo_type="space", space_sdk="gradio", exist_ok=True)
          api.upload_folder(repo_id="ChadTollison/piiguard", repo_type="space", folder_path="space")
          print("Live at https://huggingface.co/spaces/ChadTollison/piiguard")
          PY
