# Temporary: check whether v3 reads long text better in shorter windows.
name: chad-pii v3 window test
on:
  workflow_dispatch:
  push:
    branches: ["claude/pii-v3"]
    paths: ["training/window_test.py", ".github/workflows/pii-window-test.yml"]
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==2.4.1" "transformers==4.46.3" "datasets==3.1.0" "huggingface_hub<1"
          pip install --no-deps ./chad-pii
      - uses: actions/download-artifact@v4
        with: { name: v3-model, path: build/v3, run-id: 45961921851, github-token: "${{ github.token }}" }
      - name: Window sizes
        run: cd training && python window_test.py --model ../build/v3 --window 512 --window 256 --window 128
