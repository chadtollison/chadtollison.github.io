[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "scrubpii"
version = "0.7.1"
description = "Find and redact personal data and secrets in English, Spanish, French, German and Italian text, CSV, JSON, logs and DataFrames, on your own machine, with a fine-tuned DistilBERT model plus checksum rules."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Michael Chad Tollison" }]
keywords = ["presidio", "pii", "redaction", "privacy", "ner", "distilbert", "gdpr", "data-masking"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Text Processing :: Linguistic",
  "Intended Audience :: Developers",
]
dependencies = ["onnxruntime>=1.17", "tokenizers>=0.15", "huggingface_hub>=0.20", "numpy"]

[project.optional-dependencies]
test = ["pytest>=7", "pandas", "fastapi", "httpx", "presidio-analyzer>=2.2"]
server = ["fastapi>=0.100", "uvicorn>=0.20"]
pandas = ["pandas>=1.5"]
torch = ["transformers>=4.40", "torch>=2.6"]
presidio = ["presidio-analyzer>=2.2"]
pdf = ["pypdf>=4"]

[project.scripts]
scrubpii = "scrubpii.cli:main"

[project.urls]
Homepage = "https://chadtollison.github.io/privacy-tools/scrubpii/"
Model = "https://huggingface.co/ChadTollison/pii-distilbert-v5"
Source = "https://github.com/chadtollison/chadtollison.github.io/tree/main/scrubpii"

[tool.hatch.build.targets.wheel]
packages = ["src/scrubpii"]

[tool.hatch.build.targets.sdist]
exclude = ["index.html"]
